apply plugin: 'com.android.application'

// Release signing, if a keystore has been set up (see android/README.md).
// Absent, the release variant simply builds unsigned.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// The SDL2 Java shim must come from the same checkout the native build links,
// so it is read straight out of the engine's vendored SDL2.
def sdl2Java = '../../gbarecomp/third_party/SDL2/android-project/app/src/main/java'

android {
    namespace 'com.mstan.frlgrecomp'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.0.1'

        ndk {
            // 64-bit only: the generated corpus is large enough that a second
            // ABI doubles build time for hardware that no longer ships.
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.31.6'
        }
    }

    flavorDimensions += 'game'
    productFlavors {
        firered {
            dimension 'game'
            applicationId 'com.mstan.frlgrecomp.firered'
            externalNativeBuild {
                cmake {
                    targets 'FireRedRecomp'
                    arguments '-DGBAGAME_VARIANT=firered'
                }
            }
        }
        leafgreen {
            dimension 'game'
            applicationId 'com.mstan.frlgrecomp.leafgreen'
            externalNativeBuild {
                cmake {
                    targets 'LeafGreenRecomp'
                    arguments '-DGBAGAME_VARIANT=leafgreen'
                }
            }
        }
    }

    signingConfigs {
        if (keystoreProps['storeFile']) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Release is the build meant to be played: the engine compiles at
            // -O3 and the generated shards leave their iteration-speed -O1.
            externalNativeBuild {
                cmake {
                    // AGP builds the release variant as RelWithDebInfo (-O2),
                    // and cppFlags land BEFORE that, so -O2 would win.
                    // Overriding the config's own flag variable is what sticks.
                    arguments '-DGBAGAME_SHARD_OPT=-O3',
                              '-DCMAKE_CXX_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG',
                              '-DCMAKE_C_FLAGS_RELWITHDEBINFO=-O3 -DNDEBUG'
                }
            }
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main.java.srcDirs += sdl2Java
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
