# game.toml — Pokémon Olive (pokefirered decomp fork)
#
# Unlike firered/leafgreen, this variant's symbols come from the mod's OWN
# byte-matching ELF, so every function boundary is exact rather than a
# discovery seed.

[game]
name           = "Pokémon Olive"
short_name     = "olive"
default_region = "usa"

[bios]
path = "../../../gbarecomp/bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[rom]
path = "roms/olive.gba"

[recompiler]
entry_point = "0x08000000"
seeds       = "symbols/imported_symbols.tsv"
boundaries  = "symbols/function_boundaries.tsv"
out_dir     = "generated"
strict      = true

# Gen3 mainline save chip, same as its FireRed base.
[save]
type = "flash1m"

# ── Widescreen ───────────────────────────────────────────────────────
# Guest addresses for the expanded-view margin path. Olive is its own binary,
# so none of these match FireRed's — and main.cpp is shared by every variant,
# which is why they belong here rather than there. They move on every Olive
# rebuild; re-import refreshes them (see README.md).
[widescreen]
draw_metatile = 0x080A8BA4   # DrawMetatileAt
tilemap_ptrs  = 0x03006018   # gBGTilemapBuffers1
mapheader     = 0x02027004   # gMapHeader
curcoords     = 0x02021A9C   # gObjectEvents[0].currentCoords
gmain         = 0x03001CB0   # gMain (callback2 at +4)
cb2_overworld = 0x080F8440   # CB2_Overworld

# ── Autosave ─────────────────────────────────────────────────────────
# A snapshot every few minutes, rotating across three slots. Entirely separate
# from the flash save in [save]: this is an offline backup to rebuild from if
# a save is lost or corrupted, not something the game or the player interacts
# with. Restoring one never touches your cartridge save.
[autosave]
minutes = 5

# ── Read aloud ───────────────────────────────────────────────────────
# Guest functions that show a field message — people, signs, and the
# popups sharing that path. Entering one is the cue to speak it, for a
# player who cannot read yet. Battle text uses a different function and
# is deliberately absent. Addresses move on a rebuild; re-import refreshes
# them. GBARECOMP_TTS=0 silences it without a rebuild.
[tts]
# sTextPrinters: lets speech follow the page the box is drawing,
# instead of reading a whole multi-page message at once.
# Who is speaking: the object event being talked to picks the voice.
object_events = 0x02021A9C
selected_object = 0x03006294
printers = 0x0203E854
message_pcs = "0x080B3848,0x080B38F0,0x080F2124:2"
# ShowFieldMessage, FromBuffer, AddTextPrinterParameterized2 (string in r2)

[runtime]
debug_port   = 19872
window_title = "OliveRecomp"
