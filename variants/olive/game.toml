# game.toml — Pokémon Olive (pokefirered decomp fork)
#
# Unlike firered/leafgreen, this variant's symbols come from the mod's OWN
# byte-matching ELF, so every function boundary is exact rather than a
# discovery seed.

[game]
name           = "Pokémon Olive"
short_name     = "olive"
default_region = "usa"

[bios]
path = "../../../gbarecomp/bios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[rom]
path = "roms/olive.gba"

[recompiler]
entry_point = "0x08000000"
seeds       = "symbols/imported_symbols.tsv"
boundaries  = "symbols/function_boundaries.tsv"
out_dir     = "generated"
strict      = true

# Gen3 mainline save chip, same as its FireRed base.
[save]
type = "flash1m"

# ── Autosave ─────────────────────────────────────────────────────────
# A rotating ring of savestates, entirely separate from the flash save in
# [save] — this is the "I forgot to save" net, and a way back to just before
# something went wrong. Loading one never touches your cartridge save.
#
# triggers are guest PCs; entering one snapshots at the next frame boundary.
# They come from this build's own ELF, so they change whenever Olive is
# rebuilt — re-import (see README.md) and refresh them together.
[autosave]
minutes = 20
triggers = "0x08146398,0x0811376C,0x0802A104"
#           HealPlayerParty  GiveMonToPlayer  AnimTask_LevelUpHealthBox
#           (Pokémon Center) (caught a mon)   (level-up)

[runtime]
debug_port   = 19872
window_title = "OliveRecomp"
